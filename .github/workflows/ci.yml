# TEMPORARY DIAGNOSTIC BRANCH ONLY. DO NOT MERGE. NEVER RELEASE EVIDENCE.
name: NON-RELEASE Windows management-auth diagnostic
run-name: NON-RELEASE Windows batch36 observation
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact diagnostic commit reviewed by coordinator
        type: string
        required: true
      confirm_non_release:
        description: I understand this is diagnostic evidence only and must never be merged
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: non-release-windows-auth-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  diagnostic:
    name: NON-RELEASE observation only
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/diagnostic-261004-windows-auth-0818'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require reviewed SHA and explicit diagnostic acknowledgement
        env:
          REVIEWED_SHA: ${{ inputs.expected_sha }}
          CONFIRM_NON_RELEASE: ${{ inputs.confirm_non_release }}
        run: |
          if ($env:CONFIRM_NON_RELEASE -ne 'true' -or $env:REVIEWED_SHA -cne $env:GITHUB_SHA) {
            throw 'Diagnostic acknowledgement or exact SHA mismatch'
          }
      - name: Checkout reviewed diagnostic commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Setup original Bun version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install locked dependencies as in original Windows lane
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location gui
          try { bun install --frozen-lockfile; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          finally { Pop-Location }
      - name: Build original GUI test prerequisite
        working-directory: gui
        run: bun run build
      - name: Observe exact six-file batch once
        env:
          OCX_TEST_NO_QUEUE: '1'
        run: bun scripts/ci/windows-auth-diagnostic/run.ts
      - name: Upload bounded sanitized observations only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NON-RELEASE-windows-auth-${{ github.run_id }}
          path: |
            .tmp/windows-auth-artifacts/summary.json
            .tmp/windows-auth-artifacts/events.jsonl
            .tmp/windows-auth-artifacts/first-error.json
            .tmp/windows-auth-artifacts/native.json
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
